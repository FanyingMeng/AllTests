<!DOCTYPE html>
<html lang="zh">
<head>
  <meta charset="UTF-8">
  <title>题库练习</title>
  <link rel="stylesheet" href="style1.css">
</head>
<body>
  <div class="container">
    <h1 id="subjectTitle"></h1>

    <div id="progressContainer">
      <div id="progressBar"></div>
    </div>
    <p id="progressText"></p>

    <div id="questionContainer"></div>
    <div id="result"></div>

    <div class="controls">
      <button onclick="prevQuestion()">上一题</button>
      <button onclick="nextQuestion()">下一题</button>
      <button onclick="redoWrong()">错题重做</button>
      <button onclick="clearWrong()">清除错题</button>
      <button onclick="backHome()">返回首页</button>
    </div>
  </div>

  <script src="questions.js"></script>
  <script src="script.js"></script>
</body>
</html>
