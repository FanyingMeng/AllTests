<!DOCTYPE html>
<html lang="zh">
<head>
  <meta charset="UTF-8">
  <title>本地题库系统</title>
  <link rel="stylesheet" href="style1.css">
</head>
<body>
  <div class="container">
    <h1>本地题库系统</h1>
    <h2>请选择科目</h2>

    <select id="subjectSelect"></select>

    <button onclick="startQuiz()">开始复习</button>
    <button onclick="resetProgress()">重置进度</button>

    <p id="progressTip" style="color:#555; margin-top:10px;"></p>
  </div>

  <script src="questions.js"></script>
  <script>
    const select = document.getElementById("subjectSelect");

    Object.keys(questionBank).forEach(subject => {
      const option = document.createElement("option");
      option.value = subject;
      option.text = subject;
      select.appendChild(option);
    });

    const lastSubject = localStorage.getItem("lastSubject");
    if (lastSubject && questionBank[lastSubject]) {
      select.value = lastSubject;
    }

    function updateProgressTip() {
      const subject = select.value;
      const index = localStorage.getItem(`currentIndex_${subject}`);
      const tip = document.getElementById("progressTip");
      tip.innerText = index ? `你上次做到了第 ${parseInt(index) + 1} 题` : "";
    }

    updateProgressTip();
    select.addEventListener("change", updateProgressTip);

    function startQuiz() {
      const subject = select.value;
      localStorage.setItem("currentSubject", subject);
      localStorage.setItem("lastSubject", subject);
      window.location.href = "quiz.html";
    }

    function resetProgress() {
      const subject = select.value;
      if (confirm(`确定要重置 "${subject}" 的进度吗？`)) {
        localStorage.removeItem(`currentIndex_${subject}`);
        localStorage.removeItem(`wrongQuestions_${subject}`);
        updateProgressTip();
        alert("进度已重置");
      }
    }
  </script>
</body>
</html>
